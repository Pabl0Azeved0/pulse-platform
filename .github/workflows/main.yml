name: Pulse CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Create Dummy .env for CI
      run: |
        echo "SECRET_KEY=ci_secret_key" >> .env
        echo "ALGORITHM=HS256" >> .env
        echo "ACCESS_TOKEN_EXPIRE_MINUTES=30" >> .env
        echo "POSTGRES_USER=pulse" >> .env
        echo "POSTGRES_PASSWORD=pulse" >> .env
        echo "POSTGRES_DB=pulse" >> .env
        echo "DATABASE_URL=postgresql+asyncpg://pulse:pulse@db:5432/pulse" >> .env
        echo "BROADCAST_URL=redis://redis:6379" >> .env

    - name: Build and Start Services
      run: |
        docker compose up -d --build db redis backend
        
    - name: Wait for DB to be Ready
      run: sleep 10

    - name: Run Tests
      run: docker compose exec -T backend python -m pytest -p no:cacheprovider -v

    - name: Teardown
      if: always()
      run: docker compose down