services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=pulse
      - POSTGRES_PASSWORD=pulse
      - POSTGRES_DB=pulse
    ports:
      - "5432:5432"

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - pulse_uploads:/app/uploads
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://pulse:pulse@db:5432/pulse
      - BROADCAST_URL=redis://redis:6379
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173" 
    environment:
      - CHOKIDAR_USEPOLLING=true

volumes:
  postgres_data:
  pulse_uploads: